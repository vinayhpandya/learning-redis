# Build the documentation site and publish it to GitHub Pages.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to push the built site to the gh-pages branch

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate API pages from Go doc comments
        run: |
          go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0
          "$(go env GOPATH)/bin/gomarkdoc" --exclude-dirs .,./e2e --output 'docs/api/{{.Dir}}.md' ./...

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
